name: cia-teastore-v2
services:
  registry:
    image: descartesresearch/teastore-registry
    expose:
    - '8080'
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: registry
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
  db:
    image: descartesresearch/teastore-db
    expose:
    - '3306'
  persistence:
    image: descartesresearch/teastore-persistence
    expose:
    - '8080'
    environment:
      HOST_NAME: persistence
      REGISTRY_HOST: registry
      DB_HOST: db
      DB_PORT: '3306'
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: persistence
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
  auth:
    image: descartesresearch/teastore-auth
    expose:
    - '8080'
    environment:
      HOST_NAME: auth
      REGISTRY_HOST: registry
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: auth
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
  image:
    image: descartesresearch/teastore-image
    expose:
    - '8080'
    environment:
      HOST_NAME: image
      REGISTRY_HOST: registry
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: image
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
  recommender:
    image: descartesresearch/teastore-recommender
    expose:
    - '8080'
    environment:
      HOST_NAME: recommender
      REGISTRY_HOST: registry
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: recommender
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
  webui:
    image: descartesresearch/teastore-webui
    expose:
    - '8080'
    environment:
      HOST_NAME: webui
      REGISTRY_HOST: registry
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: webui
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
    - 18083:8080
    volumes:
    - D:/TGD-Runtime/cia_preexperiment/configs/opentelemetry-javaagent-1.32.0.jar:/otel/javaagent.jar:ro
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
    - 16688:16686
