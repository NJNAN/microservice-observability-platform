apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
data:
  collector.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint:\
    \ 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n  batch:\
    \ {}\nconnectors:\n  spanmetrics:\n    namespace: traces.span.metrics\n    histogram:\n\
    \      explicit:\n        buckets:\n        - 5ms\n        - 10ms\n        - 50ms\n\
    \        - 100ms\n        - 500ms\n        - 1s\n        - 5s\n    metrics_flush_interval:\
    \ 5s\nexporters:\n  otlp/jaeger:\n    endpoint: jaeger:4317\n    tls:\n      insecure:\
    \ true\n  prometheus:\n    endpoint: 0.0.0.0:8889\nservice:\n  pipelines:\n  \
    \  traces:\n      receivers:\n      - otlp\n      processors:\n      - batch\n\
    \      exporters:\n      - otlp/jaeger\n      - spanmetrics\n    metrics:\n  \
    \    receivers:\n      - otlp\n      - spanmetrics\n      exporters:\n      -\
    \ prometheus\n"
