apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      containers:
      - name: platform
        image: mop-platform:v1
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 1Gi
        env:
        - name: MOP_DATA
          value: /data
        - name: MOP_FRONTEND
          value: http://frontend:80
        - name: MOP_JAEGER
          value: http://jaeger:16686
        - name: MOP_ALLOW_MUTATIONS
          value: '1'
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
      serviceAccountName: platform
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: platform
spec:
  selector:
    app: platform
  ports:
  - name: p8000
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform
subjects:
- kind: ServiceAccount
  name: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform
