receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
connectors:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets:
        - 5ms
        - 10ms
        - 50ms
        - 100ms
        - 500ms
        - 1s
        - 5s
    metrics_flush_interval: 5s
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - otlp/jaeger
      - spanmetrics
    metrics:
      receivers:
      - otlp
      - spanmetrics
      exporters:
      - prometheus
