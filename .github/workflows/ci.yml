name: V1 engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all 23 mutations on kind
        type: boolean
        default: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/manage.py test
      - run: kubectl kustomize k8s > /tmp/rendered.yaml
      - run: docker compose config --quiet
      - run: docker build -f build/platform.Dockerfile -t mop-platform:ci .
  kind-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.27.0
      - run: pip install -r requirements-dev.txt
      - run: python scripts/manage.py up
      - run: python scripts/manage.py demo
      - if: ${{ !inputs.full_suite }}
        run: python scripts/manage.py mutation --case C01_catalog_price
      - if: ${{ inputs.full_suite }}
        run: kubectl --context kind-mop -n mop exec deployment/platform -- python -m obsplatform.cli mutation run-all
      - if: always()
        run: |
          mkdir -p artifacts
          kubectl --context kind-mop -n mop get pods -o wide > artifacts/pods.txt
          kubectl --context kind-mop -n mop exec deployment/platform -- tar czf - -C /data . > artifacts/run-data.tgz || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-evidence
          path: artifacts
